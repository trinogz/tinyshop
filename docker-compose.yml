services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: tinyshop
      POSTGRES_PASSWORD: tinyshop
      POSTGRES_DB: tinyshop
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tinyshop -d tinyshop"]
      interval: 2s
      timeout: 5s
      retries: 20

  api:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://tinyshop:tinyshop@db:5432/tinyshop
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  web:
    build: ./web
    environment:
      API_PROXY: http://api:8000
    ports:
      - "5173:5173"
    depends_on:
      - api
